name: Vérifier les tournois Beach Tennis France

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beach-tennis-france-daily-check
  cancel-in-progress: false

jobs:
  check-france:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Chercher les nouveaux tournois nationaux
        env:
          DISCORD_WEBHOOK_FRANCE_URL: ${{ secrets.DISCORD_WEBHOOK_FRANCE_URL }}
        run: python bot_france.py

      - name: Enregistrer les tournois déjà vus
        run: |
          if git diff --quiet -- seen_tournaments_france.json current_tournaments_france.json; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_tournaments_france.json current_tournaments_france.json
          git commit -m "Mémoriser les tournois nationaux déjà vus"
          git push
